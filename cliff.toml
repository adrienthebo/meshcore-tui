# Changelog from conventional commits: `git cliff -o CHANGELOG.md`
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n\n"
# Groups sort by name, so the hidden comments set their order
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only user-visible changes; chore, ci, docs, refactor, style, test and build are left out,
# as is any commit with a `changelog: skip` footer
commit_parsers = [
  { footer = "^changelog: ?skip", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", skip = true },
]
sort_commits = "oldest"
