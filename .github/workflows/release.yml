# Builds release binaries for each target and attaches them to a draft
# GitHub release when a version tag is pushed. Run it by hand to build
# without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cargo_flags: ""
          # Linux builds leave out BLE: it links libdbus, which blocks a static
          # musl binary (c87e674).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cargo_flags: --no-default-features
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cargo_flags: --no-default-features
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Package
        run: |
          name="meshcore-chat-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/meshcore-chat" README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: meshcore-chat-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes meshcore-chat-*
