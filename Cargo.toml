[package]
name = "meshcore-chat"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A TUI chat application for MeshCore mesh networking"

[dependencies]
meshcore-rs = { git = "https://github.com/adrienthebo/meshcore-rs", branch = "alt/repeater-control", default-features = false, features = [
  "serial",
  "tcp",
] }
tokio = { version = "1", features = ["full"] }
crossterm = "0.29"
ratatui = "0.30.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
getrandom = "0.4.3"

[features]
default = []
ble = ["meshcore-rs/ble"]

[dev-dependencies]
insta = "1.49.0"
